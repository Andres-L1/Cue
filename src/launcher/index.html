<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Chedex Launcher</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="brand">
        <img class="logo" src="../shared/logo.png" alt="">
        <span class="wordmark">che<em>dex</em></span>
        <span class="tag">Launcher</span>
      </header>

      <p class="label">Herramientas</p>
      <nav id="tools" class="tools" aria-label="Herramientas"></nav>

      <div class="soon" aria-hidden="true"><i></i>Más herramientas, pronto</div>
      <footer class="foot">Un proyecto de TopChess<span id="ver"></span></footer>
      <button id="profileBtn" class="tool profile-btn" type="button">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
        <span><b>Perfil</b><small id="profileUser">Sin vincular</small></span>
      </button>
    </aside>

    <main class="stage">
      <section id="detail" class="detail" hidden>
        <div class="copy">
          <p class="eyebrow"><i></i><span id="dKicker"></span></p>
          <h1 id="dName"></h1>
          <p id="dTagline" class="tagline"></p>
          <p id="dDesc" class="desc"></p>
          <ul id="dFeatures" class="features"></ul>
          <div id="dKeys" class="keys"></div>
          <div class="cta">
            <button id="launch" class="btn" type="button">Iniciar <span class="arrow">↗</span></button>
            <span id="keysHint" class="hint"><kbd>Enter</kbd> para iniciar · <kbd>↑</kbd><kbd>↓</kbd> para moverte</span>
            <span id="lockNote" class="gate-error" hidden>Vincula tu cuenta en Perfil</span>
          </div>
        </div>
        <div id="dPreview" class="preview" aria-hidden="true"></div>
      </section>

      <section id="profile" class="detail" aria-labelledby="pTitle" hidden>
        <div class="copy">
          <p class="eyebrow"><i></i>Perfil</p>
          <h1 id="pTitle"></h1>
          <div id="pLinked" class="copy" hidden>
            <p class="gate-label">Código vinculado</p>
            <p id="pHint" class="desc code-hint"></p>
            <div class="cta"><button id="pUnlink" class="btn" type="button">Desvincular</button></div>
          </div>
          <form id="pForm" class="copy" hidden>
            <p id="pText" class="desc"></p>
            <label class="gate-label" for="pCode">Código de vinculación</label>
            <input id="pCode" class="gate-input" type="text" autocomplete="off" spellcheck="false" placeholder="Pega aquí tu código">
            <p id="pError" class="gate-error" role="alert" hidden></p>
            <div class="cta">
              <button id="pLink" class="btn" type="submit">Vincular</button>
              <button id="pSite" class="gate-link" type="button">Conseguir mi código en chedex.app</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
  <section id="upgate" class="gate" aria-labelledby="upTitle" hidden>
    <div class="gate-card">
      <img class="logo" src="../shared/logo.png" alt="">
      <p class="eyebrow"><i></i>Actualización</p>
      <h2 id="upTitle"></h2>
      <p id="upText" class="desc" role="status"></p>
      <div class="cta">
        <button id="updBtn" class="btn" type="button">Actualizar ahora</button>
      </div>
    </div>
  </section>
  <script src="launcher.js"></script>
</body>
</html>
