<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Chedex Launcher</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="brand">
        <img class="logo" src="../shared/logo.png" alt="">
        <span class="wordmark">che<em>dex</em></span>
        <span class="tag">Launcher</span>
      </header>

      <p class="label">Herramientas</p>
      <nav id="tools" class="tools" aria-label="Herramientas"></nav>

      <div class="soon" aria-hidden="true"><i></i>Más herramientas, pronto</div>
      <div id="update" class="update" hidden>
        <span id="updText"></span>
        <button id="updBtn" class="updbtn" type="button" hidden>Reiniciar y actualizar</button>
      </div>
      <footer class="foot">Un proyecto de TopChess<span id="ver"></span></footer>
      <button id="unlink" class="gate-link unlink" type="button" hidden></button>
    </aside>

    <main class="stage">
      <section id="detail" class="detail" hidden>
        <div class="copy">
          <p class="eyebrow"><i></i><span id="dKicker"></span></p>
          <h1 id="dName"></h1>
          <p id="dTagline" class="tagline"></p>
          <p id="dDesc" class="desc"></p>
          <ul id="dFeatures" class="features"></ul>
          <div id="dKeys" class="keys"></div>
          <div class="cta">
            <button id="launch" class="btn" type="button">Iniciar <span class="arrow">↗</span></button>
            <span class="hint"><kbd>Enter</kbd> para iniciar · <kbd>↑</kbd><kbd>↓</kbd> para moverte</span>
          </div>
        </div>
        <div id="dPreview" class="preview" aria-hidden="true"></div>
      </section>
    </main>
  </div>
  <section id="gate" class="gate" aria-labelledby="gTitle" hidden>
    <form id="gForm" class="gate-card">
      <img class="logo" src="../shared/logo.png" alt="">
      <p class="eyebrow"><i></i>Acceso privado</p>
      <h2 id="gTitle">Vincula tu Launcher</h2>
      <p id="gText" class="desc"></p>
      <label class="gate-label" for="gCode">Código de vinculación</label>
      <input id="gCode" class="gate-input" type="text" autocomplete="off" spellcheck="false" placeholder="Pega aquí tu código">
      <p id="gError" class="gate-error" role="alert" hidden></p>
      <div class="cta">
        <button id="gLink" class="btn" type="submit">Vincular</button>
        <button id="gSite" class="gate-link" type="button">Conseguir mi código en chedex.app</button>
      </div>
    </form>
  </section>
  <script src="launcher.js"></script>
</body>
</html>
